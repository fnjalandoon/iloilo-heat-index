name: Update heat index

on:
  schedule:
    - cron: "*/20 8-15 * * *"   # every 20 min, 4:00 PM to midnight Philippine time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          pip install pytesseract pillow

      - name: Download PAGASA image
        run: |
          curl -fsSL -A "Mozilla/5.0" -o HeatIndexObserved.png \
            https://pubfiles.pagasa.dost.gov.ph/iaas/heat_index/HeatIndexObserved.png

      - name: Read Iloilo City row and update history
        run: python update.py HeatIndexObserved.png

      - name: Commit changes
        run: |
          git config user.name "heat-index-bot"
          git config user.email "heat-index-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "Update heat index data" && git pull --rebase -q && git push)
